{{define "head"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
{{if .}}<meta http-equiv="refresh" content="{{.}}">{{end}}
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kumiko Satellite</title>
<style>
  @font-face { font-family:"IBM Plex Sans"; font-style:normal; font-weight:400; font-display:swap; src:url("/fonts/ibm-plex-sans-latin-400.woff2") format("woff2"); }
  @font-face { font-family:"IBM Plex Sans"; font-style:normal; font-weight:500; font-display:swap; src:url("/fonts/ibm-plex-sans-latin-500.woff2") format("woff2"); }
  @font-face { font-family:"IBM Plex Sans"; font-style:normal; font-weight:600; font-display:swap; src:url("/fonts/ibm-plex-sans-latin-600.woff2") format("woff2"); }
  @font-face { font-family:"IBM Plex Mono"; font-style:normal; font-weight:500; font-display:swap; src:url("/fonts/ibm-plex-mono-latin-500.woff2") format("woff2"); }
  :root {
    color-scheme: light dark;
    --bg:#f3f2ee; --card:#ffffff; --fg:#1a1c1e; --muted-fg:#5f6368; --border:#e2e0d9; --input:#908d85; --muted:#f6f5f1;
    --primary:#1a1c1e; --primary-fg:#ffffff;
    --ok-fg:#1d5e36; --ok-bg:#e6f2ea; --warn-fg:#7a4b00; --warn-bg:#fbf0d9;
    --bad-fg:#9b2c23; --bad-bg:#f9e5e2; --active-fg:#205265; --active-bg:#e1edf2;
    --font-sans:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) { :root {
    --bg:#121211; --card:#1a1a19; --fg:#ecebe7; --muted-fg:#a3a19a; --border:#34332f; --input:#7c7970; --muted:#232321;
    --primary:#ecebe7; --primary-fg:#1a1a19;
    --ok-fg:#86d39f; --ok-bg:#173322; --warn-fg:#edbe6a; --warn-bg:#3a2a10;
    --bad-fg:#f3a89f; --bad-bg:#3b1d1a; --active-fg:#7fb3c9; --active-bg:#14303c;
  } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 var(--font-sans); }
  main { max-width:620px; margin:0 auto; padding:28px 16px 48px; }
  h1 { font-size:20px; font-weight:600; margin:0 0 4px; }
  h2 { font-size:16px; font-weight:600; margin:0 0 10px; }
  a { color:var(--fg); }
  .sub { color:var(--muted-fg); margin:0 0 20px; font-size:13px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:18px 20px; margin-bottom:16px; }
  .step { color:var(--muted-fg); font-size:13px; margin:0 0 4px; }
  .pill { display:inline-block; padding:2px 12px; border-radius:999px; font-weight:500; font-size:14px; background:var(--muted); color:var(--fg); }
  .pill.ok { background:var(--ok-bg); color:var(--ok-fg); } .pill.warn { background:var(--warn-bg); color:var(--warn-fg); }
  .pill.bad { background:var(--bad-bg); color:var(--bad-fg); } .pill.active { background:var(--active-bg); color:var(--active-fg); }
  progress { width:100%; height:8px; margin:14px 0 6px; accent-color:var(--primary); }
  dl { display:grid; grid-template-columns:max-content 1fr; gap:6px 18px; margin:14px 0 0; }
  dt { color:var(--muted-fg); } dd { margin:0; word-break:break-all; }
  .errtext { color:var(--bad-fg); }
  .hint { margin:12px 0 0; }
  code { display:block; margin-top:6px; padding:8px 10px; border-radius:6px; background:var(--muted); font-family:var(--font-mono); word-break:break-all; }
  button { margin-top:16px; font:inherit; font-weight:500; padding:8px 16px; border-radius:6px; border:1px solid var(--primary); background:var(--primary); color:var(--primary-fg); cursor:pointer; }
  button.quiet { background:transparent; color:var(--fg); border-color:var(--input); }
  label { display:block; font-weight:500; margin:16px 0 4px; }
  input[type=text] { width:100%; font:inherit; padding:8px 10px; border-radius:6px; border:1px solid var(--input); background:var(--card); color:var(--fg); }
  .row { display:flex; gap:8px; align-items:center; } .row input { flex:1; }
  .row button { margin-top:0; white-space:nowrap; }
  .field-err { color:var(--bad-fg); margin:4px 0 0; font-size:13px; }
  .check { display:flex; gap:8px; align-items:center; margin:16px 0 0; } .check input { width:auto; }
  .code { font:500 40px/1.2 var(--font-mono); letter-spacing:.12em; text-align:center; padding:18px 8px; margin:14px 0; background:var(--muted); border-radius:6px; user-select:all; }
  .notice { color:var(--warn-fg); margin:12px 0 0; }
  ul { list-style:none; margin:0; padding:0; max-height:420px; overflow:auto; }
  li { display:flex; gap:12px; padding:6px 0; border-top:1px solid var(--border); font-size:13px; }
  li:first-child { border-top:0; }
  time { color:var(--muted-fg); white-space:nowrap; font-variant-numeric:tabular-nums; }
  li.bad span { color:var(--bad-fg); }
</style>
</head>{{end}}
