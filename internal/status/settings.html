{{template "head" .Refresh}}
<body>
<main>
  <h1>Settings</h1>
  <p class="sub"><a href="/">Back to status</a></p>

  {{if .Notice}}<p class="notice">{{.Notice}}</p>{{end}}
  <section class="card">
    <form method="post" action="/settings/folder">
      <input type="hidden" name="token" value="{{.Token}}">
      <label for="folder" style="margin-top:0">Folder</label>
      <div class="row">
        <input type="text" id="folder" name="folder" value="{{.Folder}}" autocomplete="off">
        {{if .CanPick}}<button type="submit" formaction="/settings/pick" class="quiet">Browse…</button>{{end}}
      </div>
      {{if .FolderErr}}<p class="field-err">{{.FolderErr}}</p>{{end}}
      <div class="actions"><button type="submit">Save folder</button></div>
    </form>
  </section>

  <section class="card">
    <form method="post" action="/settings/autostart">
      <input type="hidden" name="token" value="{{.Token}}">
      <label class="check" style="margin-top:0"><input type="checkbox" name="autostart" value="on"{{if .Autostart}} checked{{end}}> Start automatically when I sign in</label>
      <div class="actions"><button type="submit">Apply</button></div>
    </form>
  </section>
  <footer class="ver">Version {{.Version}}</footer>
</main>
</body>
</html>
