name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Cross-build windows and linux on amd64 and arm64
        run: scripts/build-all.sh dist "${GITHUB_REF_NAME}"

  # Cross-builds prove nothing about schtasks or WebView2; this runs both on a real Windows desktop.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go build -trimpath -ldflags "-s -w -H=windowsgui" -o kumiko-satellite.exe ./cmd/kumiko-satellite
      - run: ./scripts/windows-smoke.ps1 -Exe ./kumiko-satellite.exe -Out smoke
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke
          path: smoke/
          if-no-files-found: ignore

  # The macOS window uses WKWebView through cgo, so this cannot be cross-built.
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: scripts/build-macos.sh dist ${{ matrix.arch }} "${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: darwin-${{ matrix.arch }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: scripts/build-all.sh dist "${GITHUB_REF_NAME}"
      - uses: actions/download-artifact@v4
        with:
          pattern: darwin-*
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --generate-notes
