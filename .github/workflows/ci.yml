name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Cross-build windows and linux on amd64 and arm64
        run: scripts/build-all.sh dist "${GITHUB_REF_NAME}"

  # Cross-builds prove nothing about schtasks or WebView2; this runs both on a real Windows desktop.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go build -trimpath -ldflags "-s -w -H=windowsgui" -o kumiko-satellite.exe ./cmd/kumiko-satellite
      - run: ./scripts/windows-smoke.ps1 -Exe ./kumiko-satellite.exe -Out smoke
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke
          path: smoke/
          if-no-files-found: ignore

  # The macOS window uses WKWebView through cgo, so this cannot be cross-built.
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: scripts/build-macos.sh dist ${{ matrix.arch }} "${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: darwin-${{ matrix.arch }}
          path: dist/*

  # Keeps a release PR (version + CHANGELOG from conventional commits) open on main; merging it
  # creates the tag and the GitHub release. The PAT is needed because a PR opened with the default
  # token starts no workflows, so the required checks would never run on it.
  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GH_PACKAGES_PAT }}

  # The binaries are built again with the release tag as version, so `kumiko-satellite version`
  # names the release and not the branch.
  release-assets:
    if: needs.release-please.outputs.release_created == 'true'
    needs: [release-please, test, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: scripts/build-all.sh dist "${TAG}"
      - name: Upload windows and linux binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${TAG}" dist/*

  release-assets-macos:
    if: needs.release-please.outputs.release_created == 'true'
    needs: [release-please, test, windows, build-macos]
    runs-on: macos-latest
    permissions:
      contents: write
    strategy:
      matrix:
        arch: [amd64, arm64]
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: scripts/build-macos.sh dist ${{ matrix.arch }} "${TAG}"
      - name: Upload macOS binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${TAG}" dist/*
